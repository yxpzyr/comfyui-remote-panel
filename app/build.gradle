plugins {
    id 'com.android.application'
}

android {
    namespace 'com.comfyremote.panel'
    compileSdk 35

    defaultConfig {
        applicationId 'com.comfyremote.panel'
        minSdk 29
        targetSdk 35
        versionCode 4
        versionName '1.3.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
