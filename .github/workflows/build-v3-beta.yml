name: 3.0beta1 optimization and multi-round validation

on:
  push:
    branches: ["feature/v3-0-beta-optimization"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v3-beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Round 1 - desktop bridge and JVM regression / stress tests
        run: |
          python3 -m unittest discover -s desktop_bridge/tests -v
          file=app/src/main/java/com/comfyremote/panel/MainActivity.java
          cp "$file" "$RUNNER_TEMP/MainActivity-fixed.java"
          git show 6cea493c787e83c2f8119bba417cd2169e9900e5:"$file" > "$file"
          gradle testDebugUnitTest --tests com.comfyremote.panel.WorkflowSwitchRecoveryTest > "$RUNNER_TEMP/baseline-switch.log" 2>&1 && baseline_passed=1 || baseline_passed=0
          mkdir -p regression-evidence
          cp app/build/test-results/testDebugUnitTest/TEST-com.comfyremote.panel.WorkflowSwitchRecoveryTest.xml regression-evidence/baseline-switch.xml
          cp "$RUNNER_TEMP/MainActivity-fixed.java" "$file"
          git diff --exit-code -- "$file"
          test "$baseline_passed" -eq 0
          python3 -c 'import xml.etree.ElementTree as E; r=E.parse("regression-evidence/baseline-switch.xml").getroot(); required=["shortcutSelectsOldCollectionOfflineWithoutRecompilingOrChangingSavedData","slowBackgroundNetworkWorkCannotBlockShortcutSelection","rapidShortcutTapsKeepTheLastSelection"]; assert all(r.find("testcase[@name="+repr(name)+"]/failure") is not None for name in required); assert int(r.get("errors","0"))==0'
          gradle cleanTestDebugUnitTest
          gradle testDebugUnitTest lintDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ComfyRemote-3.0beta1-jvm-reports
          path: |
            app/build/reports/
            app/build/test-results/
            regression-evidence/

  native:
    needs: regression
    strategy:
      fail-fast: false
      matrix:
        api: [30, 35]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle assembleDebug assembleDebugAndroidTest --stacktrace
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native validation - API ${{ matrix.api }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.api == 35 && 'google_apis' || 'default' }}
          arch: x86_64
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-snapshot
          disable-animations: true
          script: |
            bash scripts/verify-h3-native.sh
            adb pull /sdcard/Download/ComfyRemoteValidation device-validation/downloads
            adb logcat -d -s AndroidRuntime:E > device-validation/crash-log.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ComfyRemote-3.0beta1-native-api${{ matrix.api }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            device-validation/

  release:
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore permanent signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/comfyui-release.p12"
          test -s "$RUNNER_TEMP/comfyui-release.p12"
      - name: Build signed 3.0beta1
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/comfyui-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ComfyRemote-3.0beta1-signed
          path: app/build/outputs/apk/release/app-release.apk
