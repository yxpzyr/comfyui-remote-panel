name: Build Comfy PNG Extractor APK
on:
  push:
    branches:
      - comfy-png-extractor-apk-build
  pull_request:
    paths:
      - 'tools/comfy-extractor/**'
      - '.github/workflows/build-comfy-extractor.yml'
jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable APK
        working-directory: tools/comfy-extractor
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ComfyUI图片转工作流-v1.1
          path: tools/comfy-extractor/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
