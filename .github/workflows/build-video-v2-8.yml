name: Validate and sign V2.8.2 Video Input Upload

on:
  push:
    branches: [ "feature/v2-8-2-video-input-upload" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK to verify Java and Android resources
        run: gradle assembleDebug --stacktrace

      - name: Run SaveVideo and image compatibility unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ComfyRemote-V2.8.2-debug-test
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Restore permanent signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/comfyui-release.p12"
          test -s "$RUNNER_TEMP/comfyui-release.p12"

      - name: Build permanently signed release APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/comfyui-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: ComfyRemote-V2.8.2-signed
          path: app/build/outputs/apk/release/app-release.apk
