name: Validate and sign V2.8.12 reference input selection

on:
  push:
    branches: [ "feature/v2-8-12-reference-selection" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug assembleDebugAndroidTest --stacktrace
      - name: Verify the regression detects the previous reference bug
        run: |
          source=app/src/main/java/com/comfyremote/panel/WorkflowVariants.java
          cp "$source" "$RUNNER_TEMP/WorkflowVariants.fixed.java"
          git show e66e5ec5b94a91035689cbc8d177584e48c00761:"$source" > "$source"
          if gradle testDebugUnitTest --tests '*ReferenceSelectionRegressionTest.disabledLoaderInsideSelectedGroupDoesNotReturnAsDefaultPicture' > "$RUNNER_TEMP/reference-baseline.log" 2>&1; then
            cp "$RUNNER_TEMP/WorkflowVariants.fixed.java" "$source"
            echo 'The previous compiler unexpectedly passed the regression.'
            exit 1
          fi
          mkdir -p regression-baseline
          cp app/build/test-results/testDebugUnitTest/TEST-com.comfyremote.panel.ReferenceSelectionRegressionTest.xml regression-baseline/
          cp "$RUNNER_TEMP/WorkflowVariants.fixed.java" "$source"
          grep -q 'Disabled loader must be absent' regression-baseline/TEST-com.comfyremote.panel.ReferenceSelectionRegressionTest.xml
      - name: Run JVM and Android framework regressions
        run: gradle testDebugUnitTest --stacktrace
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Decode real video covers and verify immediate Back on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          ram-size: 1536M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-snapshot
          disable-animations: true
          script: |
            adb logcat -G 4M
            gradle connectedDebugAndroidTest --stacktrace
            adb pull /sdcard/Pictures/ComfyRemoteValidation device-validation
            adb logcat -d -v raw -s ReferenceSelectionValidation:I > device-validation/reference-requests.log
            python3 scripts/extract_reference_requests.py device-validation/reference-requests.log device-validation/reference-requests.json
      - name: Upload test reports and native cover evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ComfyRemote-V2.8.12-test-reports
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/androidTest-results/
            device-validation/
            regression-baseline/
      - name: Restore permanent signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/comfyui-release.p12"
          test -s "$RUNNER_TEMP/comfyui-release.p12"
      - name: Build permanently signed release APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/comfyui-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace
      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: ComfyRemote-V2.8.12-signed
          path: app/build/outputs/apk/release/app-release.apk

