name: Validate and sign V2.8.8 all video branches

on:
  push:
    branches: [ "fix/v2-8-8-savevideo-format-object" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK to verify Java and Android resources
        run: gradle assembleDebug --stacktrace

      - name: Run SaveVideo and image compatibility unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ComfyRemote-V2.8.8-debug-test
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Restore permanent signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/comfyui-release.p12"
          test -s "$RUNNER_TEMP/comfyui-release.p12"

      - name: Build permanently signed release APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/comfyui-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: ComfyRemote-V2.8.8-signed
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish test APK as downloadable GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk ComfyRemote_V2.8.8_signed.apk
          if ! gh release view v2.8.8-android-test >/dev/null 2>&1; then
            gh release create v2.8.8-android-test \
              --target "$GITHUB_SHA" \
              --title "ComfyRemote V2.8.8 (Android test build)" \
              --notes "V2.8.8 signed Android test build. SaveVideo format guard and video branch regression tests passed in CI. Device-level end-to-end video generation is not yet verified. Install over the previous version without uninstalling." \
              --prerelease \
              --latest=false
          fi
          gh release upload v2.8.8-android-test ComfyRemote_V2.8.8_signed.apk --clobber
